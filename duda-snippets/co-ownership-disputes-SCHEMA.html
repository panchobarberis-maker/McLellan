      "@type": "Question",
      "name": "Can one co-owner force the sale of jointly owned property in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "In most cases, yes. A tenant in common or joint tenant generally has the right to seek partition of co-owned real property, meaning they can ask a court to divide the property or order it sold, even over the objections of the other owners, unless that right has been validly waived or another recognized exception applies."
      }
    },
    {
      "@type": "Question",
      "name": "What is a partition action?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A partition action is a lawsuit asking the court to divide co-owned real property among the owners, either physically or, more commonly for a single home, by ordering a sale and dividing the proceeds. The court can also appoint a referee to manage the sale and resolve disputes over credits and offsets between owners."
      }
    },
    {
      "@type": "Question",
      "name": "How are expenses divided between co-owners in a dispute?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Courts generally allocate the proceeds of a sale according to each owner's percentage interest, then adjust for contributions, crediting an owner who paid more than their share of the mortgage, taxes, insurance, or necessary repairs, and offsetting amounts owed for exclusive use of the property or unpaid rent, subject to equitable adjustments and the circumstances of the case."
      }
    },
    {
      "@type": "Question",
      "name": "Can I buy out my co-owner instead of forcing a sale?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Many co-ownership disputes resolve through a negotiated buyout, where one owner purchases the other's interest at fair market value. A partition action can also be resolved through a buyout at any point before the property is sold, often at lower cost than seeing the case through trial."
      }
    },
    {
      "@type": "Question",
      "name": "What happens if my co-owner is living in the property and won't let me use it?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A co-owner generally has an equal right to possess and use the entire property, but if one owner is excluded, the excluded owner may be entitled to a credit for the fair rental value of their share during the period of exclusion, which can be resolved as part of a partition or accounting action."
      }
    },
    {
      "@type": "Question",
      "name": "How long does a partition action take in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Timelines vary based on the property, the parties' cooperation, and whether the case is contested, but partition actions often take six months to a year or more to resolve, particularly when the parties dispute the value of the property or the credits and offsets owed between them."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need an attorney to resolve a co-ownership dispute?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You are not required to have one, but co-ownership disputes involve real property valuations, complex accounting between owners, and specific statutory procedures for partition. An experienced real estate litigation attorney can help you evaluate a buyout, pursue partition, and protect your investment throughout the process."
      }
    }
