      "name": "How do I dissolve an LLC or partnership in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Voluntary dissolution generally requires a vote of the members or partners as specified in the operating or partnership agreement, followed by winding up the business's affairs, paying debts, liquidating assets, and distributing what remains according to ownership percentages, and filing dissolution paperwork with the California Secretary of State."
      }

    {
      "@type": "Question",
      "name": "Can I dissolve the business if my partner won't agree?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, in certain circumstances. California law allows a member or partner to petition the court for involuntary dissolution when the business is deadlocked, when it's no longer reasonably practicable to carry on the business, or when those in control have acted illegally, fraudulently, or oppressively."
      }
    },
    {
      "@type": "Question",
      "name": "What happens to business debts during dissolution?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Outstanding debts must generally be paid, or provided for, before any assets are distributed to owners. Creditors are typically notified and given an opportunity to submit claims. Improperly handling creditor claims or distributing assets before liabilities are satisfied or adequately provided for can create additional exposure and may subject distributions or responsible parties to claims."
      }
    },
    {
      "@type": "Question",
      "name": "How is my share of the business valued during dissolution?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Valuation is often governed by the operating or partnership agreement; absent a formula, an independent business valuation is typically used, considering the company's assets, income, liabilities, and fair market value. Disagreements over valuation are one of the most common sources of dissolution disputes."
      }
    },
    {
      "@type": "Question",
      "name": "Can I just walk away from my LLC or partnership?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not without consequences. Simply abandoning the business without formally dissolving it can leave you exposed to ongoing liabilities, tax obligations, and disputes over your ownership interest. Proper dissolution, or a negotiated buyout, protects you going forward."
      }
    },
    {
      "@type": "Question",
      "name": "What is the difference between dissolution and a buyout?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Dissolution ends the business entirely, winding up its affairs and distributing assets to all owners. A buyout allows one owner to exit while the business continues under the remaining owners, often a faster and less disruptive alternative when only one relationship has broken down."
      }
    },
    {
      "@type": "Question",
      "name": "How long does dissolving a business take in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A straightforward, amicable dissolution can be completed in a few months. Contested dissolutions, involving valuation disputes, deadlock litigation, or uncooperative partners, can take a year or more, particularly if court intervention is required."
