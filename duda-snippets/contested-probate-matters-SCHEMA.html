    {
      "@type": "Question",
      "name": "What makes a probate case 'contested'?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A probate matter becomes contested when interested parties disagree over an issue the court must resolve, such as who should serve as executor, whether property was properly valued, whether an executor is fulfilling their duties, or whether an omitted heir or creditor has a valid claim against the estate. Not every contested probate involves a will contest."
      }
    },
    {
      "@type": "Question",
      "name": "Can I object to how the executor is handling the estate?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Beneficiaries can formally object to an executor's accounting, petition the court to compel information about estate assets, and, in serious cases, seek the executor's removal for mismanagement, self-dealing, or unreasonable delay. Courts take these petitions seriously given the executor's fiduciary obligations to the estate."
      }
    },
    {
      "@type": "Question",
      "name": "How long does probate take when it's contested?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Even an uncontested California probate commonly takes many months, and contested proceedings can extend substantially longer, particularly when they involve extensive discovery, competing appraisals, or multiple hearings, though many disputes resolve well before trial once the parties exchange evidence."
      }
    },
    {
      "@type": "Question",
      "name": "What happens if an heir was left out of the will?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An omitted heir, such as a child born after the will was signed, or a spouse married after the estate plan was created, may have statutory rights to a share of the estate under California's pretermitted heir provisions, even if the will does not name them. Whether those rights apply depends on the specific facts and the language of the estate plan."
      }
    },
    {
      "@type": "Question",
      "name": "Can creditors make claims against a probate estate?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Creditors must file claims against the estate within the statutory period after notice is given, and an executor is responsible for evaluating and either approving or rejecting them. Disputes frequently arise when an executor rejects a claim the creditor believes is valid, or approves a claim heirs believe should be contested."
      }
    },
    {
      "@type": "Question",
      "name": "What can I do if the estate isn't being distributed?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Beneficiaries can petition the probate court to compel a final distribution once the estate's debts, taxes, and expenses have been resolved. If an executor is unreasonably delaying distribution without justification, the court can order the distribution and, in some cases, surcharge the executor for the delay."
      }
    },
    {
      "@type": "Question",
      "name": "Do all probate disputes go to trial?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Most contested probate matters resolve through negotiation, mediation, or court-approved settlement agreements among the heirs, which is often faster and less costly than a full trial. However, some disputes, particularly those involving significant assets or entrenched family conflict, require litigation through to trial to reach a resolution."
      }
    },
    {
      "@type": "Question",
      "name": "What is a probate dispute?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A probate dispute is any disagreement that arises while an estate is moving through the probate court, whether over who should serve as executor, how assets are valued or divided, or whether an heir or creditor has a valid claim. It doesn't require a formal will contest to qualify as a dispute."
      }
    },
    {
      "@type": "Question",
      "name": "What can I do if I'm fighting over an estate with other family members?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Family disagreements over an estate are common, and most are resolved without a full trial through negotiation or a court-approved settlement. Where family members can't agree, the probate court has authority to resolve specific disputed issues, such as who should serve as executor or how a particular asset should be divided, without necessarily requiring the whole estate to be litigated."
      }
    },
    {
      "@type": "Question",
      "name": "What can I do if the executor is not doing their job?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You can formally object to the executor's accounting, petition the court to compel information about estate assets, and, where the conduct is serious enough, ask the court to remove the executor. Documenting specific instances of delay, missing information, or self-dealing strengthens that kind of petition."
      }
    },
    {
      "@type": "Question",
      "name": "How do I stop probate?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Probate generally can't be avoided once someone has died owning assets that require court administration, though you may be able to object to specific steps within the case, such as who is appointed executor or a proposed distribution, or ask the court to pause a particular action while a dispute is resolved. Some smaller estates that qualify for simplified procedures may be able to avoid a full probate proceeding altogether, which is worth evaluating with an attorney early."
      }
    }
  ]
