      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Quid pro quo harassment occurs when a supervisor conditions a job benefit, a hire, promotion, raise, or continued employment, on the employee's submission to sexual conduct. Hostile work environment harassment occurs when unwelcome sexual conduct is severe or pervasive enough to alter the conditions of employment and create an abusive working environment. The conduct can include comments, jokes, touching, or images. Unlike quid pro quo, hostile work environment harassment can be committed by coworkers, supervisors, or even non-employees. Both types are illegal under California's FEHA and federal Title VII."
