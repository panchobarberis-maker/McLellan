      "name": "Can we be sued for terminating an at-will employee?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, and simply having an at-will policy will not defeat every claim. An at-will employee can still sue if the termination was based on a protected characteristic, was retaliatory, breached an implied contract created by handbook language or past practice, or violated public policy. That said, a documented, consistently applied, legitimate business reason is the strongest defense to these claims, and most terminations that follow sound process do not result in liability. It is worth knowing what the employee actually has to prove. Under Harris v. City of Santa Monica (2013) 56 Cal.4th 203, a FEHA plaintiff must show that a protected characteristic was a substantial motivating factor in the decision, not merely a factor present somewhere in the background. Harris also established the defense that most often limits exposure: where an employer proves it would have made the same decision for lawful reasons regardless, the employee cannot recover damages, backpay, or reinstatement, although a court may still grant declaratory or injunctive relief and the employee may remain eligible for attorney's fees. That is why the contemporaneous record of why a decision was made matters more than any argument assembled afterward."

      "name": "What steps reduce wrongful termination risk before we terminate someone?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Before finalizing a termination, work through these five steps. 1. Review the employee's personnel file for consistent documentation of the performance or conduct issue. 2. Confirm the decision does not closely follow a protected complaint or a leave request. 3. Compare how similarly situated employees were treated for comparable conduct. 4. Have HR or counsel review the decision where the employee is in a protected class, recently complained, or is longer-tenured. 5. Document the business reason before the decision is communicated, not after. A short pre-termination legal review is far less expensive than defending a lawsuit after the fact."

        "@type": "Answer",
        "text": "Do not respond informally, and do not let the response date pass. The deadline is set in the notice the agency sends you, it is shorter than most employers expect, and it is the first thing to calendar. An extension is often available on request, but only if you ask before the date passes rather than after. What you file at this stage frames the entire matter, because your position statement becomes the baseline against which the agency and, later, opposing counsel measure every subsequent explanation. A Civil Rights Department (formerly DFEH) or EEOC complaint requires a formal position statement, and what you say at this stage shapes the rest of the case. Preserve all relevant records and communications immediately, avoid discussing the complaint with the employee directly, and involve an employment attorney before submitting a response, an early, well-drafted position statement can sometimes resolve a charge before it escalates to litigation."

        "@type": "Answer",

        "@type": "Answer",
        "text": "Costs vary widely based on the complexity of the claim and whether it proceeds to trial, but defending even a straightforward single-plaintiff wrongful termination lawsuit through discovery commonly runs into the tens of thousands of dollars before any settlement or judgment. Claims involving discrimination or retaliation, or that attract a PAGA component, can cost substantially more. Early legal involvement, ideally before a complaint is filed, is almost always less expensive than litigation. It is worth being clear about what \"winning\" costs. Even a claim you are confident you will defeat still runs through pleadings, written discovery, depositions of your managers and HR staff, and often a summary judgment motion, and your people are pulled out of their jobs for all of it. A defense verdict does not refund any of that. That is why the useful question is rarely whether the claim has merit, but what the whole matter will cost to resolve on each available path, and that is a calculation worth doing early, before positions harden and before the file gets expensive."
