    {
      "@type": "Question",
      "name": "What information am I entitled to as a trust beneficiary?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California law entitles beneficiaries to be reasonably informed of the trust's terms and its administration, including receiving a copy of the trust document when requested and periodic accountings showing income, expenses, distributions, and the trust's assets. A trustee who refuses these requests without justification can be compelled by the court to comply."
      }
    },
    {
      "@type": "Question",
      "name": "How often must a trustee provide an accounting?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Trustees are generally required to provide an accounting at least annually, upon a change in trustee, and when the trust terminates, unless the trust document validly waives this requirement. Beneficiaries can petition the court to compel an accounting if the trustee fails to provide one within a reasonable time."
      }
    },
    {
      "@type": "Question",
      "name": "What can I do if a trustee is delaying my distribution?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "If the trust's debts, taxes, and administrative expenses have been resolved and no legitimate reason justifies further delay, beneficiaries can petition the probate court to compel the trustee to distribute the assets owed to them. Courts take unreasonable delay seriously, particularly where it appears to benefit the trustee."
      }
    },
    {
      "@type": "Question",
      "name": "Can I request a copy of the trust document?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Beneficiaries of an irrevocable trust, and beneficiaries of a revocable trust after the person who created it has died or become incapacitated, generally have the right to receive a copy of the trust terms relevant to their interest upon request, along with information about their share."
      }
    },
    {
      "@type": "Question",
      "name": "What should I do if the accounting I received seems incomplete?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An incomplete or vague accounting is a red flag that warrants closer review. We can request supporting documentation, formally object to the accounting in probate court, and, if the numbers don't reconcile, pursue a surcharge against the trustee for any losses the discrepancies reveal."
      }
    },
    {
      "@type": "Question",
      "name": "Do I have rights as a beneficiary of a will that's in probate?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Beneficiaries named in a will have the right to notice of the probate proceeding, to receive an accounting of the estate's administration, and to receive their distribution once debts and expenses are settled. They also have standing to object if the executor is mismanaging the estate."
      }
    },
    {
      "@type": "Question",
      "name": "Can a trustee refuse to tell me anything about the trust?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Except in narrow circumstances involving a still-living, competent settlor of a revocable trust, a trustee cannot simply refuse to communicate with beneficiaries. Beneficiaries can petition the court to compel disclosure, and a pattern of stonewalling can itself be evidence supporting removal or a breach of fiduciary duty claim."
      }
    },
    {
      "@type": "Question",
      "name": "What if I disagree with how a trustee is interpreting the trust?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Beneficiaries can petition the probate court to interpret ambiguous or disputed trust provisions, including questions about how a distribution should be calculated or who qualifies as a beneficiary. The court's interpretation resolves the disagreement and directs the trustee on how to proceed."
      }
    }
