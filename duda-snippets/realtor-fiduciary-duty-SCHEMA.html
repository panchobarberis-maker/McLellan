      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A real estate agent generally owes their client undivided loyalty, confidentiality, full and honest disclosure of material facts, reasonable care and skill, and the duty to act loyally in the client's interests rather than placing the agent's own interests first, even when that conflicts with the agent's own commission or convenience."
      }

      "name": "What is undisclosed dual agency and why does it matter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Dual agency occurs when one agent or brokerage represents both the buyer and seller in the same transaction. California law permits this only with informed written consent from both parties, because representing both sides creates an inherent conflict of interest that can compromise the agent's loyalty to either client."
      }
    },
    {

      "name": "Can I sue my real estate agent for not disclosing a defect?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, if your agent knew about a material defect and failed to disclose it to you, this can support a breach of fiduciary duty claim, separate from any disclosure obligations owed by the seller. Agents are expected to disclose facts within their knowledge that could affect your decision to buy or the price you're willing to pay."
      }
    },
    {
      "@type": "Question",
      "name": "What can I do if my agent didn't present an offer on my property?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An agent generally has a duty to present all written offers to their seller client promptly, regardless of whether the agent believes the offer is worth considering. Failing to do so can constitute a breach of fiduciary duty, potentially costing the seller a better deal."
      }
    },
    {
      "@type": "Question",
      "name": "How is a claim against a realtor different from a general breach of contract claim?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A fiduciary duty claim focuses on the trust-based relationship between an agent and their client, rather than just the terms of a listing agreement. This can allow for broader remedies and, in some cases, claims for the agent's self-dealing or conflicts of interest that a simple contract claim wouldn't reach."
      }
    },
    {
      "@type": "Question",
      "name": "How long do I have to sue a real estate agent for breach of fiduciary duty?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The applicable limitations period depends on the legal theory and nature of the alleged misconduct. Breach-of-fiduciary-duty claims often fall under a four-year period, while fraud-based claims may be governed by a three-year period running from discovery, when the breach was or reasonably should have been discovered."
      }
    },
    {
      "@type": "Question",
      "name": "Should I file a complaint with the Department of Real Estate or pursue a lawsuit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "These options are not mutually exclusive. A complaint to the California Department of Real Estate can result in professional discipline against the agent's license, but it does not compensate you for financial losses. A civil claim is generally necessary to recover damages caused by the agent's breach of duty."

    {
      "@type": "Question",
      "name": "My realtor lied to me, what can I do?",

        "@type": "Answer",
        "text": "If your agent made a false statement about a material fact and you relied on it, you may have claims for fraud or misrepresentation in addition to breach of fiduciary duty. What matters is what the agent knew, when they knew it, and what they told you, so gathering your emails, texts, and disclosure documents early is a good first step before speaking with an attorney."
      }

    {
      "@type": "Question",
      "name": "What if my realtor did not disclose something important?",

        "@type": "Answer",
        "text": "Whether an omission is actionable generally depends on whether the information was material to your decision and whether your agent knew or should have known about it. Agents generally have a duty to disclose facts within their knowledge that could affect your decision to buy, sell, or the price you're willing to accept, so the specific facts of what was known and withheld matter."
      }
