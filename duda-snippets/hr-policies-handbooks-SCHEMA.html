      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California law does not universally require every employer to have a written handbook, but many specific policies, such as anti-harassment complaint procedures, paid sick leave notices, and certain leave policies, are effectively required in writing to satisfy your legal obligations and to give you a defensible record if a dispute arises. In practice, businesses without a current handbook are significantly more exposed in litigation because they lack documented, consistently communicated policies."

      "name": "What policies are legally required in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "At minimum, California employers should have written policies covering anti-harassment and discrimination complaint procedures (required under FEHA regulations for most employers), paid sick leave, meal and rest break procedures, and reasonable accommodation processes. Depending on your size and location, additional requirements may apply, including local sick leave ordinances, pay transparency disclosures, and specific leave policies under CFRA or the Pregnancy Disability Leave law."
      }

      "@type": "Question",
      "name": "How often should we update our handbook?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California's employment laws change enough that handbooks should be reviewed at least annually, and updated whenever a significant new law takes effect, which happens most years given the volume of employment legislation passed in California. A handbook that hasn't been reviewed in several years is very likely missing requirements that have since become mandatory."
      }
    },
    {
      "@type": "Question",
      "name": "Can a handbook create an implied employment contract?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, if it isn't drafted carefully. Language that describes specific disciplinary steps, promises of continued employment, or detailed termination procedures can undermine at-will status and create an implied contract limiting your ability to terminate an employee without following those exact steps. A properly drafted handbook includes clear at-will disclaimers and avoids language that inadvertently promises a particular process."
      }
    },
    {
      "@type": "Question",
      "name": "Do we need separate policies for exempt vs non-exempt employees?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Certain policies do need to distinguish between the two, meal and rest break policies, overtime eligibility, and timekeeping requirements generally apply only to non-exempt employees, and misapplying them (or failing to clearly define which employees they cover) is a common source of wage and hour exposure. A well-drafted handbook clearly identifies which sections apply to which classification."
      }
    },
    {
      "@type": "Question",
      "name": "Can our handbook include a mandatory arbitration agreement?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An arbitration agreement can be referenced in a handbook, but California law generally requires it to be presented and signed as a standalone agreement, separate from routine handbook acknowledgment, to be enforceable. The agreement's terms also need to comply with specific California requirements to avoid being found unconscionable or unenforceable, this is an area where template language frequently falls short."

    {
      "@type": "Question",
      "name": "Can we require employees to sign an arbitration agreement?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The more useful question is whether the agreement you have will actually be enforced. California courts still apply the unconscionability framework from Armendariz, and an agreement that reads as one-sided tends to get struck down as a whole rather than trimmed. The provisions that draw the most scrutiny are limits on discovery, fee shifting that favors the employer, a shortened limitations period, and carve-outs that route the employer's claims to court while keeping the employee's in arbitration. Any one of them can cost you the entire agreement, which means litigating the case you were trying to arbitrate. On whether you can require one at all, the answer changed and then settled. California attempted to prohibit employers from conditioning employment on an arbitration agreement in Labor Code section 432.6, enacted as AB 51. The Ninth Circuit held in Chamber of Commerce of the United States v. Bonta (9th Cir. 2023) 62 F.4th 473 that the Federal Arbitration Act preempts that prohibition, and in January 2024 a federal court permanently enjoined the state from enforcing it. So requiring an arbitration agreement as a condition of employment is permitted in California today, and that is unlikely to change absent new legislation written around the preemption problem. The practical takeaway is not that you have more latitude than before. It is that the enforceability of what you actually wrote is now the whole question, and most template agreements we review have at least one provision worth fixing."
