      "@type": "Question",
      "name": "What are the legal grounds to contest a will in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California allows a will to be contested on grounds including lack of testamentary capacity, undue influence, fraud, duress, mistake, and improper execution. A successful contest typically requires more than suspicion, courts look for concrete evidence, such as medical records showing cognitive decline or communications revealing manipulation by a caregiver or family member."
      }
    },
    {
      "@type": "Question",
      "name": "How long do I have to contest a will in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "If the will has not yet been admitted to probate, a contest can generally be filed at any point before that happens. Once the court admits the will, California law generally gives interested parties only 120 days to file a contest, subject to limited statutory exceptions, making prompt action essential once you learn of a will you believe is invalid."
      }
    },
    {
      "@type": "Question",
      "name": "What is undue influence in a will contest?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Undue influence occurs when someone uses their position of trust, often a caregiver, new spouse, or close family member, to overcome the person's free will and produce an estate-plan result shaped by the influencer rather than the decedent's independent decision-making. Courts examine the decedent's dependency on the influencer, the fairness of the outcome, and whether the influencer was involved in procuring the will."
      }
    },
    {
      "@type": "Question",
      "name": "Who has legal standing to contest a will?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Only an 'interested party' may contest a will. Standing generally requires an interest that would be affected by whether the challenged will is admitted or invalidated, such as an heir or beneficiary who would receive a different inheritance under a prior will or intestacy. A person with no financial stake in the outcome typically cannot bring a contest."
      }
    },
    {
      "@type": "Question",
      "name": "What happens if a will contest succeeds?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "If a court invalidates a will, the estate is typically distributed under a prior valid will, or if none exists, according to California's intestate succession laws. In some cases, only the specific provision found invalid, such as a suspicious late amendment, is struck while the rest of the document stands."
      }
    },
    {
      "@type": "Question",
      "name": "Can a no-contest clause stop me from challenging a will?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California enforces no-contest clauses only in limited circumstances, and courts construe them narrowly. For a direct contest, California generally will not enforce a no-contest clause when the contestant had probable cause, but different rules may apply to certain property-ownership challenges and creditor claims expressly covered by the clause. An attorney should review the specific clause and the strength of your claim before you file."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need to go to trial to resolve a will contest?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not necessarily. Many will contests resolve through mediation or negotiated settlement once the evidence is exchanged, particularly when family relationships need to continue. However, some cases require trial to reach a resolution, and we prepare every case as though it may end up before a judge."
      }
    }
