    {
      "@type": "Question",
      "name": "What are the grounds for removing a trustee in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California courts may remove a trustee for breach of trust, unfitness or incapacity to perform the role, serious conflict, hostility, or breakdowns in cooperation that materially interfere with proper trust administration, failure to account, or where removal is otherwise in the best interests of the beneficiaries. Courts weigh the severity and pattern of the conduct rather than isolated, minor missteps."
      }
    },
    {
      "@type": "Question",
      "name": "Who can petition to remove a trustee?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A settlor, co-trustee, or beneficiary may petition the probate court for removal under Probate Code § 15642. The trust instrument itself may also provide procedures for removing or replacing a trustee. Beneficiaries are generally in the strongest position, since the trustee's duties run directly to them."
      }
    },
    {
      "@type": "Question",
      "name": "Can a trustee be removed without going to court?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sometimes. Some trust documents allow beneficiaries to remove a trustee by unanimous consent or a specified vote without judicial involvement. When the trust is silent, contested, or the trustee refuses to step down voluntarily, a court petition is typically required to force removal."
      }
    },
    {
      "@type": "Question",
      "name": "What happens to the trust assets while a removal petition is pending?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The current trustee generally continues managing the trust unless the court orders otherwise. In cases involving serious misconduct or risk of further loss, we can request emergency relief, such as a restraining order or requirement that the trustee post a bond, to protect assets while the petition is litigated."
      }
    },
    {
      "@type": "Question",
      "name": "How do I remove a trustee?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "In most cases, removal starts long before a petition is filed. We look first at what the trust document says, whether a written demand for an accounting or an explanation has been made and how the trustee responded, and what evidence exists of the specific problem, mismanagement, self-dealing, hostility, or something else. If informal efforts do not resolve it, the next step is a petition to the probate court asking that the trustee be removed and, usually, that a successor be appointed."
      }
    },
    {
      "@type": "Question",
      "name": "What if the trustee is not distributing trust assets?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A trustee who is unreasonably delaying distributions can be pressed to explain the holdup, and if the explanation does not hold up, may face a court petition to compel distribution or, in more serious cases, removal. Some delay is often legitimate, waiting on tax matters, unresolved claims, or unclear language in the trust, so the first step is usually finding out what is actually going on before assuming the worst."
      }
    },
    {
      "@type": "Question",
      "name": "Can I recover money the trustee mismanaged or stole?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Beyond removal, California law allows beneficiaries to pursue a surcharge against the trustee personally, seeking repayment of losses caused by mismanagement, self-dealing, or breach of fiduciary duty. In cases of bad faith, the court may also award attorney's fees and costs against the trustee."
      }
    },
    {
      "@type": "Question",
      "name": "How long does a trustee removal case typically take?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Timelines vary widely depending on the complexity of the trust, the trustee's cooperation, and whether the matter settles or proceeds to a contested hearing. Straightforward cases can resolve in a few months, while contested removals involving extensive accountings or asset tracing can take considerably longer."
      }
    },
    {
      "@type": "Question",
      "name": "I've been accused of mismanaging a trust, what should I do?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Contact an attorney immediately before responding to any petition or accounting demand. Many disputes stem from miscommunication or incomplete records rather than actual misconduct, and an experienced attorney can help you respond appropriately, correct any errors, and defend your administration of the trust."
      }
    },
    {
      "@type": "Question",
      "name": "What if I think the trustee is stealing from the trust?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Suspected theft or self-dealing is one of the more serious grounds for removal, and California law also allows beneficiaries to pursue a surcharge against a trustee personally to recover what was taken. These cases usually turn on the paper trail, bank records, trust accountings, and communications, so preserving what you already have and requesting a full accounting promptly matters."
      }
    },
    {
      "@type": "Question",
      "name": "What if the trustee will not give me an accounting?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A trustee's duty to account is one of the most basic protections beneficiaries have, and a refusal or unreasonable delay is itself something a court can address. We typically start with a clear written demand, and if that does not produce a response, the next step is asking the probate court to compel an accounting, which can also lay the groundwork for a removal petition if what eventually surfaces warrants it."
      }
    }
