        "@type": "Answer",
        "text": "PAGA , the Private Attorneys General Act , allows an aggrieved employee to file a lawsuit on behalf of the State of California to enforce labor code violations and collect civil penalties. Unlike a class action, PAGA does not require court certification. The employee acts as a private attorney general, and 35% of recovered penalties go to the affected employees while 65% go to the Labor and Workforce Development Agency (LWDA). PAGA claims cannot be eliminated through arbitration agreements the way individual claims often can."
