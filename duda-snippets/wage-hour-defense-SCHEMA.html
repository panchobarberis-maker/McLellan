      "name": "What are the biggest wage and hour risks for California employers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The most common and costly risks are misclassifying non-exempt employees as exempt, misclassifying workers as independent contractors, failing to provide compliant meal and rest breaks, and calculating overtime under federal rather than California's more generous daily-overtime standard. Because these issues are typically applied uniformly across a job title or department, a single classification error can create liability for every employee who held that role, not just one."

      "@type": "Question",
      "name": "How is worker classification determined in California (ABC test)?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California uses the ABC test to determine whether a worker is properly classified as an independent contractor. Under this test, a worker is presumed to be an employee unless the hiring business proves all three of the following: (A) the worker is free from the company's control and direction in performing the work, (B) the worker performs work outside the usual course of the hiring business, and (C) the worker is customarily engaged in an independently established business of the same nature. Failing to satisfy even one prong means the worker should be classified as an employee, with all the associated wage and hour obligations. Those three conditions are the ABC test, and the burden sits on the business: a worker providing labor or services for pay is presumed an employee unless the hiring entity establishes all three. California has since codified a long list of occupational and industry exemptions from that test, and whether a particular arrangement falls inside one of them is usually the question that actually matters. It is worth resolving before an audit or a claim forces the answer."
      }

    {
      "@type": "Question",
      "name": "What happens if the Labor Commissioner investigates my business?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A Labor Commissioner (DLSE) investigation typically begins with a wage claim filed by a current or former employee and can expand into a broader audit of your pay practices. You will generally be asked to produce payroll records, time records, and personnel files, and a hearing (called a Berman hearing) may be scheduled. Legal representation at this stage matters, an unfavorable Berman hearing decision can be appealed only by posting a bond for the full amount awarded, which makes early, well-prepared participation important."
      }

    {
      "@type": "Question",
      "name": "Can wage and hour violations become a PAGA or class action?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, and this is one of the most significant risks of a systemic wage and hour issue. Because violations like a misclassification or a defective meal break policy typically apply to an entire job category rather than one individual, a single employee's claim can expose the business to civil penalties for every similarly situated current and former employee under PAGA, or support a class action seeking damages on behalf of the entire group."
      }

      "name": "How can we reduce wage and hour liability going forward?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A periodic wage and hour compliance audit, reviewing job classifications, timekeeping systems, meal and rest break practices, and wage statement formatting against current California requirements, is the most effective way to catch issues before they become claims. California's wage and hour rules change frequently, so a classification or policy that was compliant several years ago may no longer be."

        "@type": "Answer",
        "text": "This is an obligation rather than a recommendation. California requires employers to keep itemized wage statement copies and the record of deductions for at least three years, and to keep accurate time and payroll records. Four years is the safer practice given overlapping limitations periods, and the practical reason is evidentiary: contemporaneous time punches and meal break records are usually the single most important evidence in defending a wage claim, and where records are incomplete the burden can shift to the employer to disprove the employee's account."
