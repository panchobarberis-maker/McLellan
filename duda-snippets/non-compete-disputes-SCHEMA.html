        "text": "Almost never. Business and Professions Code §16600 voids any contract that restrains someone from engaging in a lawful profession, trade, or business. This applies even to agreements signed in states where non-competes are enforceable, if the employee primarily works in or is based in California."

      "@type": "Question",
      "name": "What are the exceptions to California's non-compete ban?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The narrow exceptions apply to a person selling the goodwill of a business, an owner selling substantially all of a business's assets, partners in connection with dissolution or dissociation, and LLC members in connection with dissolution or termination of their ownership interest, when the statutory requirements are satisfied. These exceptions are construed strictly, and courts scrutinize whether an agreement is truly tied to a qualifying sale or dissolution."
      }

      "name": "Can my employer still stop me from taking clients or confidential information?",

        "@type": "Answer",
        "text": "Yes. While non-solicitation and non-compete clauses are generally void, trade secret misappropriation claims and properly drafted confidentiality agreements remain enforceable. An employer cannot bar you from working in your field, but you can still be liable for stealing trade secrets or breaching a valid NDA."

    {
      "@type": "Question",
      "name": "I signed a non-compete, should I still worry about it?",

        "@type": "Answer",
        "text": "An unenforceable clause can still cause problems if a former employer sends threatening letters, contacts your new employer, or files suit to intimidate you. Even a meritless claim can be costly and disruptive to defend, so it's worth having an attorney assess your specific agreement and situation early."
      }
    },
    {
      "@type": "Question",
      "name": "Can my company require a non-compete for new hires in California?",
      "acceptedAnswer": {
        "@type": "Answer",
