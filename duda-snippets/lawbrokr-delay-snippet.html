<script>
// Widget de Lawbrokr (el video flotante): se carga recien a los 4s o en
// la primera interaccion del usuario (lo que pase primero), asi no compite
// por ancho de banda ni bloquea el hilo principal en el primer render.
(function(){
  var cargado = false;
  function cargarLawbrokr(){
    if (cargado) return;
    cargado = true;
    window.LawbrokrConfig = {
      clip: "clip_53151a74e279cdefb7e8df8be48df65f",
      popup: "popup_ef1c053bde77b1d864a800d6b857cb84"
    };
    var s = document.createElement('script');
    s.src = '//cdn.lawbrokr.com/js/latest/lawbrokr.min.js';
    s.type = 'text/javascript';
    document.body.appendChild(s);
  }
  var eventos = ['scroll','click','touchstart','mousemove','keydown'];
  function primeraInteraccion(){
    eventos.forEach(function(ev){ window.removeEventListener(ev, primeraInteraccion); });
    cargarLawbrokr();
  }
  eventos.forEach(function(ev){ window.addEventListener(ev, primeraInteraccion, {passive:true}); });
  setTimeout(cargarLawbrokr, 4000);
})();
</script>
