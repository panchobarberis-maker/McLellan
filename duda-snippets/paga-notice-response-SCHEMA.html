      "@type": "Question",
      "name": "What is a PAGA notice and what should I do when I receive one?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A PAGA notice is a formal notification of alleged Labor Code violations sent to your business and the LWDA before a PAGA lawsuit can be filed. The moment you receive one, preserve all relevant payroll, timekeeping, and policy records, avoid contacting the employee directly about the notice, and contact an employment attorney immediately, the response window is short, and how you handle these first days can materially affect your exposure."
      }
    },
    {
      "@type": "Question",
      "name": "How much time do I have to respond?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The LWDA has 65 days from the date the notice is filed to decide whether it will investigate. You are not required to submit a formal response to the LWDA during this window in every case, but if you intend to cure any of the alleged violations, specific and shorter deadlines apply to that process. Because of these overlapping timelines, it is important to get legal advice within days of receiving the notice, not weeks."
      }
    },
    {
      "@type": "Question",
      "name": "Can I 'cure' the violations to avoid penalties?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For certain types of violations, particularly some wage statement and minor pay-related errors, California law allows an employer to cure the violation within a limited window after the notice, which can eliminate or substantially reduce penalties for that violation. Not all violations are curable, and the 2024 PAGA reforms changed several of the rules governing this process, including the deadlines and the types of violations eligible. An attorney can assess quickly whether your situation qualifies."
      }
    },
    {
      "@type": "Question",
      "name": "What happens if I ignore a PAGA notice?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "If your business does not respond and the LWDA does not act within 65 days, the employee is free to file a PAGA lawsuit seeking civil penalties for every affected pay period going back one year, calculated across all aggrieved employees. Ignoring the notice forfeits any opportunity to cure violations or negotiate an early resolution, and typically results in a significantly larger exposure than addressing the notice proactively."
      }
    },
    {
      "@type": "Question",
      "name": "How much could a PAGA claim cost my business?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "PAGA penalties are generally $100 per employee per pay period, calculated across your entire aggrieved employee population going back one year. After the 2024 reforms, the higher $200 per employee per pay period tier applies only where a court or the agency determined within the preceding five years that you had an unlawful policy or practice that caused the violation, or where the conduct was malicious, fraudulent, or oppressive. For a mid-sized workforce with a recurring violation, such as a wage statement error affecting every pay period, this can total tens or hundreds of thousands of dollars before considering attorney's fees. The reforms also created penalty caps: 15 percent where you had already taken all reasonable steps toward compliance before the notice, and 30 percent where you take them within 60 days of receiving it. There are further sub-caps of $25 for wage statement violations that caused no harm and $50 for violations lasting under 30 days or four consecutive pay periods."
      }
    },
    {
      "@type": "Question",
      "name": "Can PAGA claims be arbitrated?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Only partially. In Viking River Cruises, Inc. v. Moriana (2022), the United States Supreme Court held that an employer can compel arbitration of the individual portion of a PAGA claim, the penalties tied to the notice-filing employee's own alleged violations. The Court also suggested the employee would then lose standing to pursue the representative claims. The California Supreme Court rejected that reading in Adolph v. Uber Technologies, Inc. (2023) 14 Cal.5th 1104, holding that an employee compelled to arbitrate individual PAGA claims retains standing to pursue non-individual claims on behalf of other employees in court. An arbitration agreement can still meaningfully narrow a PAGA case, but it will rarely eliminate it entirely, so it should be treated as one part of the strategy rather than the answer to it."
      }
    }
