      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A probate conservatorship addresses adults who cannot manage their personal care or finances due to age, illness, or disability. An LPS conservatorship, established under the Lanterman-Petris-Short Act, applies specifically to individuals with a severe mental illness who are gravely disabled, and involves a distinct court process with different standards and protections."

      "name": "Who can be appointed as a conservator?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California courts generally give preference to a spouse, adult child, or other close relative, but any competent adult can petition to serve, and the court will consider who is best able to act in the proposed conservatee's interest. Where family members disagree over who should serve, the court resolves the dispute based on the conservatee's best interests."
      }

      "name": "What are signs of conservatorship abuse?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Warning signs include unexplained withdrawals or transfers from the conservatee's accounts, failure to file required accountings, isolating the conservatee from family and friends, neglecting their medical or personal care needs, and living arrangements that appear to benefit the conservator more than the conservatee."

        "@type": "Answer",
