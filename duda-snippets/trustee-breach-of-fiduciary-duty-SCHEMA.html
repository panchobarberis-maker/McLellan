      "@type": "Question",
      "name": "What duties does a trustee owe to beneficiaries in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A trustee owes beneficiaries the duty of loyalty, requiring them to act solely in the beneficiaries' interest; the duty of impartiality among beneficiaries with different interests; the duty to administer the trust prudently, including making sound investment decisions; and the duty to keep beneficiaries reasonably informed, including providing accountings on request."
      }
    },
    {
      "@type": "Question",
      "name": "What counts as self-dealing by a trustee?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Self-dealing occurs when a trustee uses trust assets or their position for personal benefit rather than the beneficiaries', for example, buying trust property at a below-market price, paying themselves excessive fees, or investing trust funds in a business they personally control. California law treats most self-dealing transactions as presumptively a breach of trust."
      }
    },
    {
      "@type": "Question",
      "name": "How do I prove a trustee breached their fiduciary duty?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Breach of fiduciary duty claims typically rely on the trust accounting, financial records, and correspondence documenting the trustee's decisions. We compare the trustee's actions against the duties imposed by the trust instrument and the Probate Code, looking for unexplained transfers, poor investment choices, undisclosed conflicts, or missed distributions."
      }
    },
    {
      "@type": "Question",
      "name": "What can I recover if a trustee breached their duty?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Beneficiaries can pursue a surcharge, which may require a trustee to restore losses caused by the breach, surrender profits obtained through the breach, or compensate the trust for profits it would otherwise have earned. Attorney's fees and costs may also be recoverable in circumstances authorized by the Probate Code or other applicable law, including certain accounting disputes involving unreasonable and bad-faith conduct. Courts may also remove the trustee and appoint a successor to prevent further harm."
      }
    },
    {
      "@type": "Question",
      "name": "Is a trustee liable for investment losses in the trust?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not automatically. Trustees are held to a standard of prudent management, not a guarantee of investment performance, and reasonable losses from a properly diversified, considered strategy are not typically a breach. Liability generally arises when a trustee invests imprudently, fails to diversify, or ignores the trust's specific investment directions."
      }
    },
    {
      "@type": "Question",
      "name": "How often is a trustee required to provide an accounting?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California generally requires a trustee to provide an accounting to beneficiaries at least annually, upon a change of trustee, and upon termination of the trust, unless the trust document waives this requirement. Beneficiaries can also petition the court to compel an accounting if a trustee refuses or unreasonably delays."
      }
    },
    {
      "@type": "Question",
      "name": "I'm a trustee accused of breaching my duties, can I defend myself?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Many claims arise from incomplete communication or reasonable, good-faith decisions that beneficiaries later question with hindsight. An experienced attorney can help you assemble documentation supporting your decisions, respond to accounting demands, and defend your administration of the trust in court if necessary."
      }
