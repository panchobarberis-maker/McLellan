      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Signing a severance agreement is always voluntary. If you decline to sign, you generally keep any legal claims you may have against your employer, but you also give up the severance payment or benefits offered in exchange for a release. Whether signing makes sense depends on the value of the severance offered compared to the strength of any claims you might be giving up, an evaluation an employment attorney can help you make before any deadline to sign expires."

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "If you are 40 or older, federal law (the Older Workers Benefit Protection Act) requires your employer to give you at least 21 days to consider an individual severance agreement, plus 7 days to revoke your signature after signing. For employees under 40, there is no fixed statutory review period, but a reasonable amount of time is expected, and an unreasonably short deadline can itself be a red flag. Regardless of your age, you should have an attorney review the agreement before the deadline to sign."

      "name": "What is a Civil Code Section 1542 waiver?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California Civil Code Section 1542 protects individuals from unknowingly releasing claims they don't know about at the time they sign a release. For a severance agreement to waive claims you are not yet aware of, it must include specific language expressly waiving your Section 1542 protections. If a severance agreement does not include a proper 1542 waiver, or the waiver was not knowing and voluntary, you may later be able to challenge the scope of what you released."

      "@type": "Question",
      "name": "What can't I be asked to give up in a severance agreement?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "More than most people expect, and the details matter. California law does not let an employer require you to release a claim for wages you already earned unless it actually pays those wages, so a release cannot quietly wipe out unpaid wages the agreement does not pay you for. Non-disparagement and confidentiality clauses cannot be used to stop you from disclosing factual information about workplace harassment, discrimination, or retaliation, and a severance agreement generally cannot bar you from reporting a suspected legal violation to a government agency. A settlement of an employment dispute also cannot include a provision barring you from ever being rehired, with a narrow exception. One caution worth understanding: keeping the right to report something to an agency is not the same as keeping the right to collect money on a claim you released. If any of this is in play in your agreement, it is worth an hour of review before you sign."
