      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A prescriptive easement allows someone to gain a legal right to use another person's land after using it openly, notoriously, continuously, and without the owner's permission for five years. Unlike adverse possession, a prescriptive easement does not require the claimant to have paid property taxes on the land."

        "@type": "Answer",
        "text": "Start by reviewing your deed and any recorded surveys, then consider hiring a licensed surveyor to establish the exact legal boundary. Many boundary disputes can be resolved through a written boundary line agreement between neighbors, but if an agreement can't be reached, a quiet title action asks the court to formally determine ownership."
      }

      "@type": "Question",
      "name": "What is a quiet title action?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A quiet title action is a lawsuit asking the court to resolve competing claims to property, including disputed boundaries, easements, or clouds on title. The court's judgment establishes clear legal ownership going forward and can be recorded to prevent future disputes over the same issue."
      }
    },
    {
      "@type": "Question",
      "name": "Can I remove a structure that encroaches on my property?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You generally have the right to seek removal of an encroaching structure through legal action, though courts sometimes weigh the cost of removal against the harm caused, particularly for minor or long-standing encroachments. An attorney can evaluate whether injunctive relief, damages, or a negotiated resolution best fits your situation."
      }
    },
    {
      "@type": "Question",
      "name": "What is the difference between an easement and adverse possession?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An easement grants a right to use another's land for a specific purpose, such as access, without transferring ownership. Adverse possession, by contrast, can transfer actual ownership of the land itself, but requires the claimant to have paid all property taxes on the disputed parcel during the required possession period."
      }
    },
    {
      "@type": "Question",
      "name": "Can an easement be terminated or modified?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, in certain circumstances. Easements may be terminated through agreement, abandonment, expiration or fulfillment of their purpose, merger, or other circumstances recognized by California law. Modifying an easement typically requires the agreement of both property owners."
      }
