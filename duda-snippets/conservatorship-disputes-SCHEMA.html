      "@type": "Question",
      "name": "What is the difference between a conservatorship of the person and of the estate?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A conservatorship of the person gives the conservator authority over an individual's daily care, including housing, meals, and medical decisions. A conservatorship of the estate gives the conservator authority over the person's finances and assets. Courts can grant either type alone or both together, depending on the conservatee's needs."
      }
    },
    {
      "@type": "Question",
      "name": "What is the difference between a probate conservatorship and an LPS conservatorship?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A probate conservatorship addresses adults who cannot manage their personal care or finances due to age, illness, or disability. An LPS conservatorship applies to individuals who meet California's statutory definition of grave disability because of a qualifying mental health or substance-use condition and is governed by a separate legal framework from probate conservatorships."
      }
    },
    {
      "@type": "Question",
      "name": "Who can be appointed as a conservator?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California courts generally give preference to a spouse, adult child, or other close relative, but any competent adult can petition to serve, and the court will consider who is best able to act in the proposed conservatee's interest. Where family members disagree over who should serve, the court resolves the dispute based on the conservatee's best interests."
      }
    },
    {
      "@type": "Question",
      "name": "What are signs of conservatorship abuse?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Warning signs include unexplained withdrawals or transfers from the conservatee's accounts, failure to file required accountings, isolating the conservatee from family and friends, neglecting their medical or personal care needs, and living arrangements that appear to benefit the conservator more than the conservatee."
      }
    },
    {
      "@type": "Question",
      "name": "Can a conservatorship be contested before it's granted?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The proposed conservatee or other interested parties can object to a conservatorship petition, argue that less restrictive alternatives exist, or contest who should be appointed. California requires clear and convincing evidence that the statutory grounds for a conservatorship are satisfied, and probate conservatorships must be tailored as the least restrictive alternative needed to protect the proposed conservatee."
      }
    },
    {
      "@type": "Question",
      "name": "How do I remove a conservator who isn't fulfilling their duties?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An interested party can petition the probate court to remove a conservator for failing to provide adequate care, mismanaging assets, or otherwise acting against the conservatee's best interests. The court can appoint a successor conservator and, where warranted, order the removed conservator to account for and repay any losses."
      }
    },
    {
      "@type": "Question",
      "name": "Can a conservatorship be terminated?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. A conservatorship can be terminated if the conservatee regains capacity, or in the case of an LPS conservatorship, when it is no longer necessary. Interested parties, including the conservatee, may petition the court to end the conservatorship and restore the person's full legal rights."
      }
    },
    {
      "@type": "Question",
      "name": "How do I stop a conservatorship?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "If a petition has been filed and you believe a conservatorship isn't necessary, you or another interested party can file a formal objection before the hearing, present evidence that less restrictive alternatives exist, and ask the court to deny the petition. If a conservatorship has already been granted, interested parties, including the conservatee, can later petition the court to terminate it."
      }
    },
    {
      "@type": "Question",
      "name": "What is conservatorship abuse?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Conservatorship abuse occurs when a conservator uses their court-granted authority against the conservatee's interests rather than for their protection, for example by mismanaging or misappropriating assets, isolating the conservatee from family, or neglecting their medical or personal care. Suspected abuse can be reported to the court and may support a petition to remove the conservator."
      }
    },
    {
      "@type": "Question",
      "name": "How do I remove a conservator?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Removing a conservator generally starts with documenting your concerns, whether that involves missing money, neglected care, or a pattern of decisions that don't serve the conservatee. An interested party then petitions the probate court, which can suspend or remove the conservator and appoint a successor while the matter is resolved."
      }
    },
    {
      "@type": "Question",
      "name": "What are the alternatives to conservatorship?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Conservatorship is meant to be used only when less restrictive options aren't sufficient. Depending on the person's needs, alternatives can include a durable power of attorney, an advance health care directive, supported decision-making arrangements, or a trust already in place to manage assets. Which alternative fits, if any, depends on whether valid documents exist and the person's current capacity."
      }
    }
