      "name": "What are CC&Rs and are they legally binding?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CC&Rs (Covenants, Conditions & Restrictions) are recorded documents that govern a common interest development, and they are legally binding on every owner within that community, running with the land regardless of who currently holds title. Violations can be enforced through fines, liens, or, in some cases, litigation."
      }

    {
      "@type": "Question",
      "name": "Can an HOA fine me without warning?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Generally no. Under the Davis-Stirling Act, associations must typically provide written notice of an alleged violation and an opportunity for a hearing before imposing discipline such as fines. If the association skipped required procedural steps, its enforcement action may be invalid."
      }
    },
    {
      "@type": "Question",
      "name": "Can an HOA place a lien on my property for unpaid fines?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Associations can generally record a lien for unpaid assessments, but California law places restrictions on liening a property solely for unpaid fines related to CC&R violations, as opposed to regular or special assessments. The specific rules depend on the nature and amount of the debt."
      }
    },
    {
      "@type": "Question",
      "name": "What can I do if my HOA is enforcing rules unevenly?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Selective or inconsistent enforcement can be challenged, particularly if the association is disciplining some owners for a violation while ignoring the same conduct by others. Documentation of the inconsistent treatment is critical, and an attorney can evaluate whether the enforcement pattern gives rise to a legal claim."
      }
    },
    {
      "@type": "Question",
      "name": "How do I challenge a CC&R violation notice?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Start by reviewing the governing documents to confirm the alleged violation actually breaches a recorded restriction, then request the hearing the association is required to offer. If the internal process doesn't resolve the dispute, options include mediation, alternative dispute resolution required under the Davis-Stirling Act, or litigation."
      }
    },
    {
      "@type": "Question",
      "name": "Can CC&Rs be changed or amended?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, but typically only through the amendment procedures specified in the governing documents. Amendments generally must comply with the voting requirements in the governing documents and applicable California law and, when required, must be properly recorded. An association generally cannot enforce a new restriction that wasn't properly adopted."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need an attorney for a CC&R dispute?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CC&R disputes involve interpreting recorded governing documents alongside statutory requirements under the Davis-Stirling Act, and missteps on either side can be costly. An experienced real estate litigation attorney can evaluate your documents, protect your rights, and guide you toward the most efficient resolution."
      }
    },
    {
      "@type": "Question",
      "name": "My HOA fined me, what can I do?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Start by requesting the association's file on the violation and confirming it followed its own required notice and hearing procedures before imposing the fine. If a required step was skipped, or the underlying conduct doesn't actually breach a recorded restriction, the fine may be challengeable. An attorney can review the governing documents and the association's process to evaluate your options."
      }
    },
    {
      "@type": "Question",
      "name": "Can my HOA make me do something I disagree with?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An association generally can require compliance with rules that are properly adopted and recorded in the governing documents, but its authority isn't unlimited. Whether a specific demand is enforceable depends on whether the rule was validly adopted, whether it's being applied consistently, and whether it falls within the scope of what the CC&Rs actually authorize."
      }
    },
    {
      "@type": "Question",
      "name": "Can my HOA put a lien on my house?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Associations can generally record a lien for unpaid assessments, but California law places restrictions on liening a property solely for unpaid fines related to CC&R violations, as opposed to regular or special assessments. If you've received a lien notice, the specific basis for it matters and is worth reviewing before it's recorded."
      }
    },
    {
      "@type": "Question",
      "name": "How do I fight my HOA?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Review the governing documents to understand what the association can and can't do, use the internal hearing and dispute resolution process the Davis-Stirling Act generally requires, and document everything in writing. If the internal process doesn't resolve the dispute, options include mediation, statutorily required alternative dispute resolution, or litigation. Acting early, before deadlines in the internal process close, generally preserves more options."
      }
    }
