<script>

(function(){var chico=window.matchMedia("(max-width:768px)").matches;var hero=document.querySelector(".emp-hero");if(!hero)return;var activo=hero.querySelector(chico?".video-mobile":".video-desktop");var otro=hero.querySelector(chico?".video-desktop":".video-mobile");if(otro)otro.remove();if(activo){var f=activo.querySelector("source");if(f&&f.dataset.src){f.src=f.dataset.src;activo.load();activo.play().catch(function(){});}}})();

function toggleFaq(btn) {
  // El boton ahora vive dentro de un H3, asi que el contenedor ya no es el
  // padre directo. closest() lo encuentra sin importar cuantos niveles haya.
  var item = btn.closest('.faq-item');
  var answer = item.querySelector('.faq-answer');
  var isOpen = item.classList.contains('open');
  document.querySelectorAll('.faq-item.open').forEach(function(el){
    el.classList.remove('open');
    el.querySelector('.faq-answer').style.maxHeight = null;
    // Sin esto el lector de pantalla sigue anunciando "expandido".
    var b = el.querySelector('.faq-question');
    if (b) b.setAttribute('aria-expanded', 'false');
  });
  if (!isOpen) {
    item.classList.add('open');
    answer.style.maxHeight = answer.scrollHeight + 'px';
    btn.setAttribute('aria-expanded', 'true');
  }
}

// Si la URL trae el ancla de una pregunta, se abre sola y queda a la vista.
// Es lo que hace util tener un link por pregunta.
(function(){
  function abrirDelHash(){
    var h = location.hash.slice(1);
    if (!h) return;
    var a = document.getElementById(h) || document.getElementById(h.replace(/-h$/, ''));
    if (!a || !a.classList.contains('faq-answer')) return;
    var b = document.getElementById(a.id + '-h');
    if (b && b.getAttribute('aria-expanded') !== 'true') b.click();
    setTimeout(function(){ a.scrollIntoView({block: 'center'}); }, 60);
  }
  window.addEventListener('hashchange', abrirDelHash);
  window.addEventListener('load', abrirDelHash);
})();

(function(){
  var track = document.getElementById('empTrack');
  var el = document.getElementById('empCarousel');
  if (!track || !el) return;
  var dots = document.querySelectorAll('#empDots .emp-dot');
  var current = 0, total = dots.length, startX = 0, timer;
  function goToEmp(n){
    current = (n + total) % total;
    track.style.transform = 'translateX(-' + (current * 100) + '%)';
    dots.forEach(function(d,i){ d.classList.toggle('active', i===current); });
  }
  window.goToEmp = goToEmp;
  function next(){ goToEmp(current+1); }
  timer = setInterval(next, 5000);
  el.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; clearInterval(timer); }, {passive:true});
  el.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx)>40){ goToEmp(dx<0 ? current+1 : current-1); }
    timer = setInterval(next, 5000);
  }, {passive:true});
})();

(function(){
  var els = document.querySelectorAll('.reveal');
  if (!els.length) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    els.forEach(function(el){ el.classList.add('in-view'); });
    return;
  }
  if (!('IntersectionObserver' in window)) {
    els.forEach(function(el){ el.classList.add('in-view'); });
    return;
  }
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
  els.forEach(function(el){ observer.observe(el); });
})();

// Red de seguridad: si el observador no llega a disparar, nada queda invisible.
setTimeout(function(){
  document.querySelectorAll('.mlgE-trust-probate .reveal:not(.in-view)').forEach(function(el){
    if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add('in-view');
  });
}, 1200);
</script>
