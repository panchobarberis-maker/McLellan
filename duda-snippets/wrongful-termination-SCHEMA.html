      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. California is an at-will employment state, but that does not mean your employer can fire you for any reason. Terminations that violate anti-discrimination laws, are in retaliation for protected activity, breach an implied or express contract, or violate public policy are all wrongful, even if you were at-will. An at-will policy is a starting point, not a shield against illegal firings."

        "@type": "Answer",

        "@type": "Answer",

      "@type": "Question",
      "name": "How do I prove wrongful termination in California?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "To prove wrongful termination in California, you generally must show that (1) you were an employee, (2) your employer terminated you, (3) a discriminatory, retaliatory, or unlawful reason was a substantial motivating factor in the decision, and (4) you suffered harm as a result. Evidence includes emails, performance reviews, witness statements, the timing of the termination relative to protected activity, and inconsistencies in the reason your employer gave. California courts use the \"substantial motivating factor\" standard, the illegal reason does not have to be the only reason for the termination. In Harris v. City of Santa Monica (2013) 56 Cal.4th 203, the California Supreme Court held that a FEHA plaintiff must show discrimination was a substantial motivating factor in the decision, not merely a motivating factor. The Court also held that where an employer proves it would have made the same decision for lawful reasons regardless, the employee's remedies can be limited, though the employer does not escape liability entirely. That is why the strength of your evidence on the employer's actual reasoning matters so much."

        "@type": "Answer",
        "text": "Signing a severance agreement may limit your ability to sue, but it depends on the terms and how it was presented. Under the federal Older Workers Benefit Protection Act, an employee 40 or older must be given at least 21 days to consider an individual severance agreement and 7 days to revoke after signing. For a group layoff or exit incentive program, the consideration period is 45 days and the employer must disclose information about the group of employees selected. Separately, a release of FEHA claims must be knowing and voluntary, and a release of unknown claims requires an express Civil Code section 1542 waiver. If you were pressured to sign, given too little time, or the agreement did not meet these requirements, it may be unenforceable in whole or in part. Have an attorney review it before you sign."

        "@type": "Answer",
