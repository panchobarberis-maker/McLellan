      "name": "Who owes a fiduciary duty in a California business?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Partners, managers and certain members of LLCs, corporate officers and directors, and certain agents may owe fiduciary duties depending on the entity structure, governing documents, and their role in the business. Majority shareholders in closely held corporations can also owe fiduciary duties to minority shareholders."
      }
    },
    {
      "@type": "Question",
      "name": "What are the two main fiduciary duties under California law?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The duty of loyalty requires acting in the business's best interest rather than a fiduciary's personal interest, prohibiting self-dealing and competing ventures. The duty of care requires acting with the same care an ordinarily prudent person would exercise in similar circumstances, including making informed decisions."
      }
    },
    {
      "@type": "Question",
      "name": "What are common examples of breach of fiduciary duty?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Common examples include diverting a business opportunity to a competing venture, using company funds for personal expenses, competing directly with the business while still a partner or officer, withholding material information from co-owners, and self-dealing transactions that benefit the fiduciary at the business's expense."
      }
    },
    {
      "@type": "Question",
      "name": "What damages can I recover for breach of fiduciary duty?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "California allows recovery of the actual losses caused by the breach, disgorgement of any profits the fiduciary improperly obtained, and in cases involving fraud, oppression, or malice, punitive damages. An accounting may also be ordered to trace where company funds went."
      }
    },
    {
      "@type": "Question",
      "name": "What is the deadline to file a breach of fiduciary duty claim?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Breach-of-fiduciary-duty claims are often subject to a four-year limitations period in California, but a different period may apply depending on the nature of the alleged misconduct, including claims sounding in fraud. Because fiduciary breaches are often concealed, the discovery rule may also affect when the period begins."
      }
    },
    {
      "@type": "Question",
      "name": "Can I bring a claim on behalf of the business, not just myself?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Certain fiduciary breach claims, particularly against corporate officers or directors, may need to be brought as a derivative action on behalf of the company, rather than a direct claim by an individual shareholder. We evaluate which type of claim fits your situation."
      }
    },
    {
      "@type": "Question",
      "name": "Can a minority shareholder sue a majority shareholder for breach of fiduciary duty?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Majority shareholders in a closely held California corporation owe a fiduciary duty to minority shareholders and cannot use their control to oppress or unfairly disadvantage them, for example, by freezing them out of profits or decision-making."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need a lawyer to pursue a fiduciary duty claim?",
      "acceptedAnswer": {
        "@type": "Answer",
