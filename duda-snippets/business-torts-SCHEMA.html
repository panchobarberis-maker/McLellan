      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tortious interference occurs when a third party, not a party to your contract, intentionally disrupts your contractual or business relationship, causing you economic harm. California treats interference with an existing, fixed-term contract differently from interference with a merely prospective relationship, and that difference is usually the first question in the case."

      "name": "Is there a difference between interfering with a contract and interfering with a business relationship?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, and it is usually the difference that decides these cases. If someone intentionally causes another party to break a contract with you that ran for a fixed term, that interference is treated as a wrong in itself. If instead they cost you a relationship you merely expected to form or to continue, a prospective customer, a deal that had not closed, California requires more. You have to show the competitor did something independently wrongful, meaning something unlawful in its own right, and not just that they competed hard or wanted your business. Courts have been explicit that an improper motive alone is not enough. One wrinkle matters more in business than most people expect: if your contract could be terminated at will by either side, California treats it much more like a prospective relationship than like a fixed-term contract, and the independently wrongful act requirement applies there as well, because from a third party's point of view there is no legal assurance the relationship would have continued in either case. Because so many commercial arrangements are terminable at will, supply terms, distribution deals, month-to-month vendor relationships, this is frequently the first thing that determines whether a claim works. In practice this is why our first questions are not about what you lost. They are what the contract actually said about termination, and what the other side actually did to win your business away. Misrepresentation, use of your trade secrets, or inducing someone to breach a duty they owed you will support a claim. Aggressive but lawful competition generally will not."
