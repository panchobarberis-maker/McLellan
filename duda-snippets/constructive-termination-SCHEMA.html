        "@type": "Answer",
        "text": "California courts, following Turner v. Anheuser-Busch, Inc. (1994), require an employee to show that the employer intentionally created or knowingly permitted working conditions so unusually adverse that a reasonable employee in the same position would have felt compelled to resign. The standard is objective — it does not turn on how the individual employee subjectively felt, and ordinary workplace stress, a single bad review, or a difficult supervisor is generally not enough on its own."

      "acceptedAnswer": {

      "name": "Is constructive termination the same as being fired?",
