      "name": "What damages are available in a California workplace discrimination case?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "In a successful California workplace discrimination case under FEHA, you may recover lost wages and benefits (back pay from the date of the adverse action), future lost earnings (front pay), emotional distress damages, and attorney's fees. In cases of malice, oppression, or fraud by the employer, punitive damages may also be available. There is no cap on compensatory or punitive damages under FEHA, unlike federal Title VII, which caps damages based on employer size. The total value of a case depends on your salary, the duration of the harm, and the strength of the evidence."
